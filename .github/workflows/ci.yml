name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q

      # Run the whole pipeline end to end, so a broken import or step fails the build.
      - name: Pipeline smoke test
        run: |
          python -m src.make_sample_data
          python -m src.run_pipeline
